{# Кнопки уровней цены: levels, sid, cid (None — «Авто»), show_qty #}
<div class="levels">
  {% for lv in levels %}
  <form method="post" action="{{ P }}/buy" class="lv-form">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="sid" value="{{ sid }}">
    {% if cid %}<input type="hidden" name="cid" value="{{ cid }}">{% endif %}
    <input type="hidden" name="price" value="{{ lv.price|int }}">
    <button class="lv" type="submit">
      <b>{{ lv.price|rub }}</b>{% if show_qty %}<small>{{ qty(lv.count) }}</small>{% endif %}
    </button>
  </form>
  {% endfor %}
</div>
