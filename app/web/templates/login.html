{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:360px;margin:80px auto">
  <h1>{{ 'Кабинет партнёра' if is_ref else 'Shifr SMS — вход' }}</h1>
  {% if error %}<p class="bad">{{ error }}</p>{% endif %}
  <form method="post" action="{{ A }}/login" style="display:grid;gap:10px">
    <input type="text" name="username" placeholder="Логин" autocomplete="username" required>
    <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
    <button>Войти</button>
  </form>
</div>
{% endblock %}
